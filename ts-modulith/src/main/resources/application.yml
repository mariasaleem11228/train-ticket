server:
  port: 18080
spring:
  modulith:
    detection-strategy: explicitly-annotated
    runtime:
      verification-enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: true
  application:
    name: ts-modulith
  data:
    mongodb:
      uri: ${STATION_MONGO_URI:mongodb://localhost:27017/ts}
  rabbitmq:
    host: ${FOOD_RABBIT_HOST:migration-rabbitmq}
    port: ${FOOD_RABBIT_PORT:5672}
    username: ${FOOD_RABBIT_USER:migration}
    password: ${FOOD_RABBIT_PASSWORD:local-benchmark-only}
  mail:
    host: ${NOTIFICATION_SMTP_HOST:migration-mailpit}
    port: ${NOTIFICATION_SMTP_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.ssl.enable: false
      mail.smtp.starttls.enable: false
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000
management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
  endpoint:
    health:
      show-details: never
modulith:
  wait-order:
    enabled: ${WAIT_ORDER_ENABLED:false}
    writes-enabled: ${WAIT_ORDER_WRITES_ENABLED:false}
    retry-enabled: ${WAIT_ORDER_RETRY_ENABLED:false}
    jdbc-url: ${WAIT_ORDER_JDBC_URL:jdbc:mysql://ts-wait-order-mysql:3306/waitorderservice}
    username: ${WAIT_ORDER_DB_USER:root}
    password: ${WAIT_ORDER_DB_PASSWORD:root}
  ticketinfo:
    enabled: ${TICKETINFO_ENABLED:false}
  fooddelivery:
    enabled: ${FOOD_DELIVERY_ENABLED:false}
    writes-enabled: ${FOOD_DELIVERY_WRITES_ENABLED:false}
    jdbc-url: ${FOOD_DELIVERY_JDBC_URL:jdbc:mysql://ts-food-delivery-mysql:3306/fooddeliveryservice}
    username: ${FOOD_DELIVERY_DB_USER:root}
    password: ${FOOD_DELIVERY_DB_PASSWORD:root}
  delivery:
    enabled: ${DELIVERY_ENABLED:false}
    writes-enabled: ${DELIVERY_WRITES_ENABLED:false}
    queue: ${DELIVERY_QUEUE:food_delivery}
    jdbc-url: ${DELIVERY_JDBC_URL:jdbc:mysql://ts-delivery-mysql:3306/deliveryservice}
    username: ${DELIVERY_DB_USER:root}
    password: ${DELIVERY_DB_PASSWORD:root}
  avatar:
    enabled: ${AVATAR_ENABLED:false}
    worker: ${AVATAR_WORKER:/app/avatar_worker.py}
  voucher:
    enabled: ${VOUCHER_ENABLED:false}
    writes-enabled: ${VOUCHER_WRITES_ENABLED:false}
    jdbc-url: ${VOUCHER_JDBC_URL:jdbc:mysql://ts-voucher-mysql:3306/voucherservice}
    username: ${VOUCHER_DB_USER:root}
    password: ${VOUCHER_DB_PASSWORD:root}
  news:
    enabled: ${NEWS_ENABLED:false}
  ticketoffice:
    enabled: ${TICKET_OFFICE_ENABLED:false}
    writes-enabled: ${TICKET_OFFICE_WRITES_ENABLED:false}
    mongo-uri: ${TICKET_OFFICE_MONGO_URI:mongodb://ts-ticket-office-mongo:27017/ticket-office}
  adminuser:
    enabled: ${ADMIN_USER_ENABLED:false}
  adminorder:
    enabled: ${ADMIN_ORDER_ENABLED:false}
  admintravel:
    enabled: ${ADMIN_TRAVEL_ENABLED:false}
  adminroute:
    enabled: ${ADMIN_ROUTE_ENABLED:false}
  adminbasic:
    enabled: ${ADMIN_BASIC_ENABLED:false}
  user:
    enabled: ${USER_ENABLED:false}
    writes-enabled: ${USER_WRITES_ENABLED:false}
    mongo-uri: ${USER_MONGO_URI:mongodb://ts-user-mongo:27017/ts-user-mongo}
  identity:
    enabled: ${AUTH_ENABLED:false}
    writes-enabled: ${AUTH_WRITES_ENABLED:false}
    mongo-uri: ${AUTH_MONGO_URI:mongodb://ts-auth-mongo:27017/ts-auth-mongo}
  verifycode:
