    queue: ${NOTIFICATION_QUEUE:email}
    from: ${NOTIFICATION_FROM:trainticket_notify@163.com}
    test-to: ${NOTIFICATION_TEST_TO:trainticket_notify@163.com}
  food:
    enabled: ${FOOD_ENABLED:false}
    writes-enabled: ${FOOD_WRITES_ENABLED:false}
    mongo-uri: ${FOOD_MONGO_URI:mongodb://ts-food-mongo:27017/ts}
