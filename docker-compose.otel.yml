x-otel-environment: &otel-environment
  JAVA_TOOL_OPTIONS: -javaagent:/otel/opentelemetry-javaagent.jar
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  OTEL_PROPAGATORS: tracecontext,baggage
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=train-ticket,deployment.environment.name=baseline-instrumented

x-otel-volumes: &otel-volumes
  - ./observability/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar:ro

services:
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    command: ["--set=receivers.otlp.protocols.grpc.endpoint=0.0.0.0:4317", "--set=receivers.otlp.protocols.http.endpoint=0.0.0.0:4318"]
    ports:
      - "16686:16686"
    networks:
      - my-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - jaeger
    networks:
      - my-network

  ts-admin-basic-info-service:
    environment: { <<: *otel-environment, OTEL_SERVICE_NAME: ts-admin-basic-info-service }
    volumes: *otel-volumes
  ts-admin-order-service:
    environment: { <<: *otel-environment, OTEL_SERVICE_NAME: ts-admin-order-service }
    volumes: *otel-volumes
