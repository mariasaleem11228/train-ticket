services:
  modulith:
    image: train-ticket/ts-modulith:notification-candidate
    environment:
      NOTIFICATION_ENABLED: "true"
      NOTIFICATION_WRITES_ENABLED: "true"
  notification-legacy:
    image: codewisdom/ts-notification-service:0.2.0
    profiles: [routing]
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xmx192m"
    volumes:
      - ./messaging.properties:/config/application.properties:ro
    networks: [legacy]
