services:
  modulith:
    image: train-ticket/ts-modulith:rebook-candidate
    environment:
      REBOOK_ENABLED: "true"
      REBOOK_WRITES_ENABLED: "true"
  rebook-legacy:
    image: codewisdom/ts-rebook-service:0.2.0
    profiles: [routing]
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xmx192m"
    networks: [legacy]
