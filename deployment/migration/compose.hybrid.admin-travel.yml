services:
  modulith:
    image: train-ticket/ts-modulith:admin-travel-candidate
    environment:
      ADMIN_TRAVEL_ENABLED: "true"
  admin-travel-legacy:
    image: codewisdom/ts-admin-travel-service:0.2.0
    profiles: [routing]
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xmx192m"
    networks: [legacy]
