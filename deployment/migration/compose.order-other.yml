services:
  station-module-test:
    image: train-ticket/ts-modulith:spring-modulith-1.4
  order-other-legacy-test:
    image: train-ticket/order-other-legacy-no-seed:0.2.0
    environment:
      SPRING_DATA_MONGODB_HOST: station-test-mongo
      SPRING_DATA_MONGODB_DATABASE: order_other_legacy
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xmx192m"
    ports: ["127.0.0.1:22032:12032"]
    networks: [migration-test]
  order-other-module-test:
    image: train-ticket/ts-modulith:spring-modulith-1.4
    environment:
      STATION_MONGO_URI: mongodb://station-test-mongo:27017/module
      STATION_WRITES_ENABLED: "false"
      ORDERS_ENABLED: "false"
      ORDER_OTHER_ENABLED: "true"
      ORDER_OTHER_MONGO_URI: mongodb://station-test-mongo:27017/order_other_module
      ORDER_OTHER_WRITES_ENABLED: "true"
      TZ: Asia/Shanghai
    ports: ["127.0.0.1:18084:18080"]
    networks: [migration-test]
  order-other-candidate:
    image: train-ticket/ts-modulith:spring-modulith-1.4
    environment:
      STATION_MONGO_URI: mongodb://ts-station-mongo:27017/ts
      STATION_WRITES_ENABLED: "false"
      ORDERS_ENABLED: "false"
      ORDER_OTHER_ENABLED: "true"
      ORDER_OTHER_MONGO_URI: mongodb://ts-order-other-mongo:27017/ts
      ORDER_OTHER_WRITES_ENABLED: "false"
      TZ: Asia/Shanghai
    ports: ["127.0.0.1:18085:18080"]
    networks: [legacy]
