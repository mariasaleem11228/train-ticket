services:
  security-legacy-test:
    image: codewisdom/ts-security-service:0.2.0
    environment:
      SPRING_DATA_MONGODB_HOST: station-test-mongo
      SPRING_DATA_MONGODB_DATABASE: legacy-security
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xmx192m"
    ports: ["127.0.0.1:21188:11188"]
    networks: [migration-test, legacy]
  security-module-test:
    image: train-ticket/ts-modulith:security-candidate
    environment:
      STATION_MONGO_URI: mongodb://ts-station-mongo:27017/ts
      STATION_WRITES_ENABLED: "false"
      ORDERS_ENABLED: "true"
      ORDER_MONGO_URI: mongodb://ts-order-mongo:27017/ts
      ORDER_WRITES_ENABLED: "false"
      ORDER_OTHER_ENABLED: "true"
      ORDER_OTHER_MONGO_URI: mongodb://ts-order-other-mongo:27017/ts
      ORDER_OTHER_WRITES_ENABLED: "false"
      CONFIG_ENABLED: "true"
      CONFIG_MONGO_URI: mongodb://ts-config-mongo:27017/ts
      CONFIG_WRITES_ENABLED: "false"
      SEAT_ENABLED: "true"
      SECURITY_ENABLED: "true"
      SECURITY_MONGO_URI: mongodb://station-test-mongo:27017/module-security
      SECURITY_WRITES_ENABLED: "true"
      TZ: Asia/Shanghai
    ports: ["127.0.0.1:18090:18080"]
    networks: [migration-test, legacy]
  security-candidate:
    image: train-ticket/ts-modulith:security-candidate
    environment:
      STATION_MONGO_URI: mongodb://ts-station-mongo:27017/ts
      STATION_WRITES_ENABLED: "false"
      ORDERS_ENABLED: "true"
      ORDER_MONGO_URI: mongodb://ts-order-mongo:27017/ts
      ORDER_WRITES_ENABLED: "false"
      ORDER_OTHER_ENABLED: "true"
      ORDER_OTHER_MONGO_URI: mongodb://ts-order-other-mongo:27017/ts
      ORDER_OTHER_WRITES_ENABLED: "false"
      CONFIG_ENABLED: "true"
      CONFIG_MONGO_URI: mongodb://ts-config-mongo:27017/ts
      CONFIG_WRITES_ENABLED: "false"
      SEAT_ENABLED: "true"
      SECURITY_ENABLED: "true"
      SECURITY_MONGO_URI: mongodb://ts-security-mongo:27017/ts
      SECURITY_WRITES_ENABLED: "false"
      TZ: Asia/Shanghai
    ports: ["127.0.0.1:18089:18080"]
    networks: [legacy]
