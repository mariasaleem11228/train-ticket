services:
  modulith:
    image: train-ticket/ts-modulith:assurance-candidate
    environment:
      ASSURANCE_ENABLED: "true"
      ASSURANCE_WRITES_ENABLED: "true"
  assurance-legacy:
    image: codewisdom/ts-assurance-service:0.2.0
    profiles: [routing]
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xmx192m"
    networks: [legacy]
