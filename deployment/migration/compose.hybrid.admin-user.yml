services:
  modulith:
    image: train-ticket/ts-modulith:admin-user-candidate
    environment:
      ADMIN_USER_ENABLED: "true"
  admin-user-legacy:
    image: codewisdom/ts-admin-user-service:0.2.0
    profiles: [routing]
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xmx192m"
    networks: [legacy]
