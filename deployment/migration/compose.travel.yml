x-travel-dependencies: &travel-dependencies
  STATION_MONGO_URI: mongodb://ts-station-mongo:27017/ts
  STATION_WRITES_ENABLED: "false"
  ORDERS_ENABLED: "true"
  ORDER_MONGO_URI: mongodb://ts-order-mongo:27017/ts
  ORDER_WRITES_ENABLED: "false"
  ORDER_OTHER_ENABLED: "true"
  ORDER_OTHER_MONGO_URI: mongodb://ts-order-other-mongo:27017/ts
  ORDER_OTHER_WRITES_ENABLED: "false"
  CONFIG_ENABLED: "true"
  CONFIG_MONGO_URI: mongodb://ts-config-mongo:27017/ts
  CONFIG_WRITES_ENABLED: "false"
  SEAT_ENABLED: "true"
  TRAIN_ENABLED: "true"
  TRAIN_MONGO_URI: mongodb://ts-train-mongo:27017/ts
  TRAIN_WRITES_ENABLED: "false"
  ROUTE_ENABLED: "true"
  ROUTE_MONGO_URI: mongodb://ts-route-mongo:27017/ts
  ROUTE_WRITES_ENABLED: "false"
  TRAVEL_ENABLED: "true"
  TRAVEL_WRITES_ENABLED: "false"
  TRAVEL_MONGO_URI: mongodb://ts-travel-mongo:27017/ts
  TZ: Asia/Shanghai
services:
  travel-legacy-test:
    image: train-ticket/travel-legacy-no-seed:0.2.0
    environment:
      SPRING_DATA_MONGODB_HOST: station-test-mongo
      SPRING_DATA_MONGODB_DATABASE: legacy-travel
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xmx192m"
    ports: ["127.0.0.1:22346:12346"]
    networks: [migration-test, legacy]
  travel-module-test:
    image: train-ticket/ts-modulith:travel-candidate
    environment:
      <<: *travel-dependencies
      TRAVEL_MONGO_URI: mongodb://station-test-mongo:27017/module-travel
      TRAVEL_WRITES_ENABLED: "true"
    ports: ["127.0.0.1:18099:18080"]
    networks: [migration-test, legacy]
  travel-candidate:
    image: train-ticket/ts-modulith:travel-candidate
    environment: *travel-dependencies
    ports: ["127.0.0.1:18098:18080"]
    networks: [legacy]
