# Local benchmark infrastructure. No external SMTP deliveries.
spring.rabbitmq.host=migration-rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=migration
spring.rabbitmq.password=local-benchmark-only
spring.mail.host=migration-mailpit
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
