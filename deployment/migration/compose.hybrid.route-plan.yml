services:
  modulith:
    image: train-ticket/ts-modulith:route-plan-candidate
    environment:
      ROUTE_PLAN_ENABLED: "true"
  route-plan-legacy:
    image: codewisdom/ts-route-plan-service:0.2.0
    profiles: [routing]
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xmx192m"
    networks: [legacy]
