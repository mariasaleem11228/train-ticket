services:
  modulith:
    image: train-ticket/ts-modulith:auth-candidate
    environment:
      AUTH_ENABLED: "true"
      AUTH_WRITES_ENABLED: "true"
  auth-legacy:
    image: codewisdom/ts-auth-service:0.2.0
    profiles: [routing]
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xmx192m"
    networks: [legacy]
