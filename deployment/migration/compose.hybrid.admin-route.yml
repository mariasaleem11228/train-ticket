services:
  modulith:
    image: train-ticket/ts-modulith:admin-route-candidate
    environment:
      ADMIN_ROUTE_ENABLED: "true"
  admin-route-legacy:
    image: codewisdom/ts-admin-route-service:0.2.0
    profiles: [routing]
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xmx192m"
    networks: [legacy]
