services:
  notification-mongo:
    image: mongo:4.4
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    volumes: [notification-data:/data/db]
    networks:
      legacy:
        aliases: [ts-notification-mongo]
  rabbitmq:
    image: rabbitmq:3.13-alpine@sha256:d7af1c87c5f1eda13fcfca06db452bf3aeab6619fc3358b68535c0c02c4e52bc
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: migration
      RABBITMQ_DEFAULT_PASS: local-benchmark-only
    networks:
      legacy:
        aliases: [migration-rabbitmq]
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
  mailpit:
    image: axllent/mailpit@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    restart: unless-stopped
    ports: ["127.0.0.1:8025:8025"]
    networks:
      legacy:
        aliases: [migration-mailpit]
networks:
  legacy:
    external: true
    name: train-ticket_my-network
volumes:
  notification-data: {}
  rabbitmq-data: {}
