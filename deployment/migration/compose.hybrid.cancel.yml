services:
  modulith:
    image: train-ticket/ts-modulith:cancel-candidate
    environment:
      CANCEL_ENABLED: "true"
      CANCEL_WRITES_ENABLED: "true"
  cancel-legacy:
    image: codewisdom/ts-cancel-service:0.2.0
    profiles: [routing]
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xmx192m"
    networks: [legacy]
