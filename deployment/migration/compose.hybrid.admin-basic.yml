services:
  modulith:
    image: train-ticket/ts-modulith:admin-basic-candidate
    environment:
      ADMIN_BASIC_ENABLED: "true"
  admin-basic-legacy:
    image: codewisdom/ts-admin-basic-info-service:0.2.0
    profiles: [routing]
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xmx192m"
    networks: [legacy]
